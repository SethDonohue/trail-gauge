<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-label="Wired CAN nodes feed one hub, which streams to the phone over BLE" font-size="13"><style>svg{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--cds-text-primary:#1f2328;--cds-text-secondary:#59636e;--cds-chart-axis:#828b95;--cds-chart-categorical-1:#2f6fd8;--cds-chart-reference-tint:#f3f4f6;--cds-page:#ffffff}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#e6edf3;--cds-text-secondary:#9198a1;--cds-chart-axis:#6e7681;--cds-chart-categorical-1:#58a6ff;--cds-chart-reference-tint:#161b22;--cds-page:#0d1117}}</style><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><rect width="760" height="480" rx="12" fill="var(--cds-page)"/><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Wired CAN nodes feed one hub, which streams to the phone over BLE</text><g><rect x="24" y="64" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="36" y="88" font-weight="600" fill="var(--cds-text-primary)">Engine-bay node</text><text x="36" y="104" font-size="11.5" fill="var(--cds-text-secondary)">Coolant NTC sender</text><text x="36" y="120" font-size="11.5" fill="var(--cds-text-secondary)">Oil thermocouple (option)</text></g><g><rect x="272" y="64" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="284" y="88" font-weight="600" fill="var(--cds-text-primary)">Exterior node</text><text x="284" y="104" font-size="11.5" fill="var(--cds-text-secondary)">Ambient DS18B20 probe</text><text x="284" y="120" font-size="11.5" fill="var(--cds-text-secondary)">Shaded, behind bumper</text></g><g><rect x="520" y="64" width="216" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="532" y="88" font-weight="600" fill="var(--cds-text-primary)">LoRa node (optional)</text><text x="532" y="104" font-size="11.5" fill="var(--cds-text-secondary)">Battery or solar powered</text><text x="532" y="120" font-size="11.5" fill="var(--cds-text-secondary)">Only if wiring impractical</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M132 136V172"></path><path d="M380 136V172"></path><path d="M132 172H380" stroke-width="2"></path><path d="M256 172V216" marker-end="url(#arch-arrow)"></path></g><text x="264" y="200" font-size="11.5" fill="var(--cds-text-secondary)">CAN 2.0B, 250 kbit/s, + switched 12 V</text><g><path d="M628 136V216" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arch-arrow)"></path><text x="636" y="180" font-size="11.5" fill="var(--cds-text-secondary)">LoRa, AES-CCM</text></g><g><rect x="24" y="216" width="712" height="112" rx="8" fill="var(--cds-chart-reference-tint)" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="240" font-weight="600" fill="var(--cds-text-primary)">Master hub, under the dash</text></g><g><rect x="40" y="256" width="158" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="52" y="280" font-weight="600" fill="var(--cds-text-primary)">ESP32-S3</text><text x="52" y="296" font-size="11.5" fill="var(--cds-text-primary)">Fusion, filters, BLE</text></g><g><rect x="214" y="256" width="158" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="226" y="280" font-weight="600" fill="var(--cds-text-primary)">IMU + magnetometer</text><text x="226" y="296" font-size="11.5" fill="var(--cds-text-secondary)">Isolated, 200 Hz</text></g><g><rect x="388" y="256" width="158" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="400" y="280" font-weight="600" fill="var(--cds-text-primary)">Barometer</text><text x="400" y="296" font-size="11.5" fill="var(--cds-text-secondary)">BMP390 class, QNH</text></g><g><rect x="562" y="256" width="158" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="574" y="280" font-weight="600" fill="var(--cds-text-primary)">Power front end</text><text x="574" y="296" font-size="11.5" fill="var(--cds-text-secondary)">Fuse, TVS, 60 V buck</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M80 328V384" marker-end="url(#arch-arrow)"></path><path d="M224 384V328" marker-end="url(#arch-arrow)"></path></g><text x="88" y="360" font-size="11.5" fill="var(--cds-text-secondary)">BLE notify, 25 Hz</text><text x="232" y="360" font-size="11.5" fill="var(--cds-text-secondary)">Control writes</text><g><rect x="24" y="384" width="260" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="36" y="408" font-weight="600" fill="var(--cds-text-primary)">Android phone, S24 reference</text><text x="36" y="424" font-size="11.5" fill="var(--cds-text-secondary)">React Native, Skia, Reanimated</text><text x="36" y="440" font-size="11.5" fill="var(--cds-text-secondary)">GNSS: QNH, declination, speed</text></g><g><rect x="476" y="384" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="488" y="408" font-weight="600" fill="var(--cds-text-primary)">Vehicle battery, 12 V</text><text x="488" y="424" font-size="11.5" fill="var(--cds-text-secondary)">Constant feed + ignition line</text><path d="M600 384V328" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><text x="608" y="360" font-size="11.5" fill="var(--cds-text-secondary)">Fused 2 A</text></g></svg>
