name: Android APK

# Builds the TrailGauge app and publishes each build as a GitHub Release with the APK attached.
# Latest APK, direct link: https://github.com/<owner>/<repo>/releases/latest/download/trailgauge.apk
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        env:
          EXPO_NO_TELEMETRY: 1
        run: |
          npx expo prebuild --platform android --clean --no-install
          # One CPU architecture (all current phones, including the S24) halves build time.
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          # A rising versionCode lets each new APK install over the previous one.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle

      - name: Build release APK
        working-directory: app/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      # Paused while 0.3.0's features are rebuilt into this code: pushes still build and test, but
      # only a manual run (Actions > Android APK > Run workflow) publishes a release.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          build=${{ github.run_number }}
          mkdir -p dist
          # Fixed asset name, so .../releases/latest/download/trailgauge.apk always works.
          cp android/app/build/outputs/apk/release/app-release.apk dist/trailgauge.apk
          {
            echo "TrailGauge $version, build $build (commit ${GITHUB_SHA::7})."
            echo
            git log -1 --format=%B "$GITHUB_SHA" | grep -v -E '^(Co-Authored-By|Claude-Session):'
            echo
            echo "Install: download trailgauge.apk on the phone and open it."
          } > dist/notes.md
          gh release create "build-$build" dist/trailgauge.apk \
            --title "TrailGauge $version (build $build)" \
            --notes-file dist/notes.md \
            --target "$GITHUB_SHA" \
            --latest
