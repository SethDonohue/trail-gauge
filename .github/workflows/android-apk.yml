name: Android APK

# Builds the TrailGauge app and attaches the installable APK to the run.
# Open the run under the Actions tab and download "trailgauge-apk" from its Artifacts section.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        env:
          EXPO_NO_TELEMETRY: 1
        run: |
          npx expo prebuild --platform android --clean --no-install
          # One CPU architecture (all current phones, including the S24) halves build time.
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties

      - name: Build release APK
        working-directory: app/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/trailgauge-$(node -p 'require("./package.json").version')-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: trailgauge-apk
          path: app/dist/*.apk
          retention-days: 30
